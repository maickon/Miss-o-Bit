<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missão Bit</title>
  <meta name="description" content="Jogo de cartas para aprender lógica de programação: algoritmo, variável, condição e repetição.">
  <meta name="theme-color" content="#FF6A2B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Missão Bit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <button class="brand" data-go="inicio" aria-label="Ir para o início">
        <span id="brand-bit"></span><b>Missão <span>Bit</span></b>
      </button>
      <nav class="nav" aria-label="Seções">
        <button data-go="inicio">Início</button>
        <button data-go="missoes">Jogar</button>
        <button data-go="estudar">Estudar</button>
        <button data-go="professor">Professor</button>
      </nav>
      <button class="btn small primary install-btn" id="btn-install" hidden>📲 Instalar app</button>
      <button class="icon-btn" id="btn-sound" aria-label="Som ligado" title="Ligar/desligar som">🔊</button>
      <button class="icon-btn" id="btn-theme" aria-label="Trocar tema claro/escuro" title="Tema claro/escuro">🌓</button>
    </div>
  </header>

  <main class="wrap">
    <section id="v-inicio" class="view" hidden></section>
    <section id="v-missoes" class="view" hidden></section>
    <section id="v-jogo" class="view" hidden></section>
    <section id="v-estudar" class="view" hidden></section>
    <section id="v-professor" class="view" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="modal-bg" id="install-help" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ih-title">
      <h2 id="ih-title">📲 Instalar o Missão Bit</h2>
      <div id="ih-body"></div>
      <button class="btn primary" id="ih-close">Entendi</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
