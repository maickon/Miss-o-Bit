<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missão Bit</title>
  <meta name="description" content="Jogo de cartas para aprender lógica de programação: algoritmo, variável, condição e repetição.">
  <meta name="theme-color" content="#FF6A2B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <button class="brand" data-go="inicio" aria-label="Ir para o início">
        <span id="brand-bit"></span><b>Missão <span>Bit</span></b>
      </button>
      <nav class="nav" aria-label="Seções">
        <button data-go="inicio">Início</button>
        <button data-go="missoes">Jogar</button>
        <button data-go="estudar">Estudar</button>
        <button data-go="professor">Professor</button>
      </nav>
      <button class="icon-btn" id="btn-sound" aria-label="Som ligado" title="Ligar/desligar som">🔊</button>
      <button class="icon-btn" id="btn-theme" aria-label="Trocar tema claro/escuro" title="Tema claro/escuro">🌓</button>
    </div>
  </header>

  <main class="wrap">
    <section id="v-inicio" class="view" hidden></section>
    <section id="v-missoes" class="view" hidden></section>
    <section id="v-jogo" class="view" hidden></section>
    <section id="v-estudar" class="view" hidden></section>
    <section id="v-professor" class="view" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
